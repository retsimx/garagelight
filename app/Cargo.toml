[package]
name = "garagelight-app"
version = "0.1.0"
edition = "2021"

[features]
default = ["version-beacon", "ota-beacon"]
radio-smoke = []
update-selftest = []
selftest-broken = ["update-selftest"]
selftest-fail-ble = []
lamp-latency = []
ota-beacon = []
version-beacon = []

[[bin]]
name = "garagelight-app"
path = "src/main.rs"

[[bin]]
name = "radio_smoke"
path = "src/bin/radio_smoke.rs"
required-features = ["radio-smoke"]

[[bin]]
name = "update_selftest"
path = "src/bin/update_selftest.rs"
required-features = ["update-selftest"]

[[bin]]
name = "update_image"
path = "src/bin/update_image.rs"
required-features = ["update-selftest"]

[dependencies]
garagelight-core = { workspace = true }

[build-dependencies]
# Host-only build dependency for fetching the (gitignored) CYW43 blobs at build
# time. Pure-Rust TLS (rustls) so no system OpenSSL is required.
ureq = "3"

[target.'cfg(target_arch = "arm")'.dependencies]
# `boot2-none`: the app links `link.x` (not `link-rp.x`) and must not embed the
# 256-byte second-stage bootloader; the GL-3 bootloader owns boot2.
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040", "boot2-none"] }
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-net = { workspace = true, features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet", "dns"] }
cyw43 = { workspace = true, features = ["defmt", "bluetooth", "firmware-logs"] }
cyw43-pio = { workspace = true, features = ["defmt"] }
bt-hci = { workspace = true }
trouble-host = { workspace = true, features = ["peripheral", "gatt", "derive", "default-packet-pool"] }
embassy-boot = { workspace = true }
embassy-embedded-hal = { workspace = true }
embedded-storage = { workspace = true }
embedded-storage-async = { workspace = true }
static_cell = { workspace = true }
# thumbv6m has no atomic CAS; portable-atomic (used by static_cell) needs the
# critical-section backend. Matches the upstream embassy-rp examples.
portable-atomic = { version = "1.5", features = ["critical-section"] }
sha2 = { workspace = true }
minimq = { workspace = true }
dht-sensor = { workspace = true }
# GL-10 OTA transport: TLS 1.3 over embassy-net. The entropy source is
# embassy-rp's `clocks::RoscRng` (the RP2040 ROSC random bit), so no direct
# `rand_core` dependency is needed.
# No `defmt`: the handshake error is logged as a bare line, and dropping the
# feature keeps the embedded-tls `defmt::Format` impls out of the image (the
# debug-profile FLASH budget is tight).
#
# `rustpki` + `rsa` (and its implied `alloc`) are required to verify the
# RSA-PSS/RSA-PKCS#1 handshake signature presented by the real endpoint's
# Let's Encrypt RSA certificate. RSA verification allocates, so the crate's
# `alloc` feature is on and the firmware provides a static heap (see
# `src/heap.rs`).
embedded-tls = { version = "0.19", default-features = false, features = ["rustpki", "rsa", "alloc"] }
embedded-io-async = "0.7"
# Static heap backing `embedded-tls`'s `alloc`-enabled RSA verification. Only
# `llff` (linked-list first-fit) is enabled: the default also pulls `tlsf`
# (and its `rlsf`/`const-default` deps), which the image does not use.
embedded-alloc = { version = "0.6", default-features = false, features = ["llff"] }
# `rsa` pulls `num-bigint-dig` -> `lazy_static` -> `spin`. thumbv6m has no
# `compare_exchange`, so `spin` must use `portable-atomic` (backed by the
# `critical-section` impl already enabled below) instead of `core` atomics.
# `lazy_static` already enables spin's `once`; this only adds the backend.
spin = { version = "0.9", default-features = false, features = ["portable_atomic"] }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

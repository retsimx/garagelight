[package]
name = "garagelight-bootloader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "garagelight-bootloader"
path = "src/main.rs"

[dependencies]
# embassy-rp is needed for the stock `link-rp.x` (which places the `.boot2`
# section) and for the flash/watchdog peripherals the bootloader drives.
# `rp2040` selects the RP2040 PAC; `critical-section-impl` provides the chip's
# multicore-safe critical section, which the flash driver requires. The
# `__INTERRUPTS` vector table links whether or not the workspace build unifies
# in embassy-rp's `rt` feature (rp-pac supplies it under `rt`, cortex-m-rt
# supplies its own default table otherwise).
embassy-rp = { workspace = true, features = ["rp2040", "critical-section-impl"] }
embassy-boot-rp = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
# defmt is pulled in so its `defmt.x` linker script is on the search path
# (build.rs passes `-Tdefmt.x`); defmt-rtt provides the RTT transport.
defmt = { workspace = true }
defmt-rtt = { workspace = true }
